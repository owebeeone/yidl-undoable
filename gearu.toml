[project]
name = "yidl-undoable"
branch = "main"
remote = "origin"
tag_prefix = "v"
github_repo = "owebeeone/yidl-undoable"

[python]
version = "static"
manifest = "pyproject.toml"

[release]
checks = [
    ["uv", "run", "--no-project", "--python", "3.13", "--with", "build==1.6.1", "--with", "twine==7.0.0", "python", "scripts/check_release.py"],
]
github_notes = """
yidl-undoable {tag} — specialized accessors, compiled-builder caching and user documentation.

The normal decorator now uses field-specific generated accessors and reuses
compiled model builders through YIDL Cache. Cache hits bind fresh classes,
schemas, defaults and callbacks, with generated-source inspection preserved.
Transactions, undo/redo and the public model API retain their existing contract.

The end-user documentation includes progressive guides, eight runnable examples,
field/callback reference and troubleshooting:
https://owebeeone.github.io/yidl-undoable/

The 414-test suite passes on CPython 3.12–3.15 with Python and native Rust
backends. Gearu also checks built wheel/sdist installation and regeneration.
Original accessor/cache measurements and independent reviews remain in dev-docs/.
The existing schema field-name limitation and Windows CPython 3.15 dependency-wheel
qualification limit remain documented. This release does not add disk-backed undo
history or concurrent-manager isolation.
"""
