[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
[project]
name = "yidl-undoable"
version = "0.1.0"
description = "YIDL generated transactional data classes with sparse undo history"
requires-python = ">=3.12"
dependencies = ["yidl>=0.1.0", "astichi>=1.1.3", "yidl-lifecycle>=0.1.0"]
[project.optional-dependencies]
dev = ["pytest>=7"]
[project.scripts]
yidl-undoable-regenerate-base = "yidl_undoable.regenerate_undoable_base:main"
[tool.uv.sources]
yidl = {path = "../yidl", editable = true}
yidl-cache = {path = "../yidl-cache", editable = true}
astichi = {path = "../astichi", editable = true}
yidl-lifecycle = {path = "../yidl-lifecycle", editable = true}
[tool.hatch.build.targets.wheel]
packages = ["src/yidl_undoable"]
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "dev-docs", "README.md", "pyproject.toml"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
